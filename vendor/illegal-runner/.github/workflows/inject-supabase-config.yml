name: Inject Supabase runtime config

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: github.event.head_commit.message != 'Inject Supabase runtime config'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add runtime config loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          loader = '<script src="/api/config.js"></script>'
          if loader not in s:
              s = s.replace(marker, marker + '\n' + loader, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Inject Supabase runtime config"
          git push
